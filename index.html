<script>
const HOLES=[4,9,13,18],SEGS=[[1,4],[5,9],[10,13],[14,18]];
const PARS={langara:[4,3,5,4,4,4,4,3,4,4,5,3,4,3,4,5,4,4],mccleery:[5,4,3,4,3,4,3,4,5,4,5,4,3,5,4,3,4,4],kamloops:[4,5,3,4,4,5,4,3,4,4,4,5,3,4,3,4,4,5]};
const W={3:11,4:14,5:17};
const COURSE_NAMES={fraserview:'Fraserview',langara:'Langara',mccleery:'McCleery',kamloops:'Kamloops Golf and Country Club'};
function ckey(course){const c=(course||'').toLowerCase();return Object.keys(PARS).find(k=>c.includes(k))||'fraserview'}
function defFR(course){const k=ckey(course);if(!PARS[k])return [59/250,125/250,181/250,1];
 const w=PARS[k].map(p=>W[p]);const cum=HOLES.map(h=>w.slice(0,h).reduce((a,b)=>a+b,0));return cum.map(x=>x/cum[3])}
function courseFR(course){try{const o=JSON.parse(localStorage.getItem('pc_alloc')||'{}')[ckey(course)];if(o&&o.length==4)return o}catch(e){}return defFR(course)}
const P={
 parseDur(s){s=String(s||'').trim();let m=s.match(/^(\d{1,2})\D+(\d{1,2})$/);if(!m){const d=s.replace(/\D/g,'');if(/^\d{3}$/.test(d))m=[0,d[0],d.slice(1)];else if(/^\d{4}$/.test(d))m=[0,d.slice(0,2),d.slice(2)];else if(/^\d{1}$/.test(d))m=[0,d,'0']}if(!m||+m[2]>59)return null;const v=(+m[1])*60+(+m[2]);return v>=60&&v<=480?v:null},
 fmtDur(m){m=Math.round(m);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')},
 fmt12(min){min=((Math.round(min)%1440)+1440)%1440;let h=Math.floor(min/60),mm=min%60;const ap=h<12?'am':'pm';h=h%12||12;return h+':'+String(mm).padStart(2,'0')+ap},
 hm(s){const[a,b]=s.split(':');return +a*60+ +b},
 targets(tee,dur,course){return courseFR(course).map(f=>tee+Math.round(dur*f))},
 cls(d){return d<=2?'g':d<=5?'a':'r'},
 sgn(d){return (d>0?'+':d<0?'−':'±')+Math.abs(d)+' min'}
};
if(typeof module!=='undefined'){module.exports=P}
if(typeof document!=='undefined'){
const $=id=>document.getElementById(id),LS=localStorage;
let st=JSON.parse(LS.getItem('pc_cur')||'null')||{date:new Date().toISOString().slice(0,10),tee:'09:54',tgt:'4:10',act:[null,null,null,null]};
{const sel=document.getElementById('course');Object.values(COURSE_NAMES).forEach(n=>{const o=document.createElement('option');o.value=o.textContent=n;sel.appendChild(o)});if(st.course){const c=st.course.toLowerCase(),k=Object.keys(COURSE_NAMES).find(k=>c.includes(k));st.course=k?COURSE_NAMES[k]:'';LS.setItem('pc_cur',JSON.stringify(st))}}
let hist=JSON.parse(LS.getItem('pc_hist')||'[]');
const UPLOAD_URL='https://script.google.com/macros/s/AKfycbz2yNO0msfE8xX8awzvjj226hAWziWcxx-qlZRNMqiEpfcTRm58yGQFUoB8K3Y9j2AJ/exec';// Drawmaster Apps Script /exec URL (set after deployment)
const APP_VERSION='2026-10-13';
const save=()=>{LS.setItem('pc_cur',JSON.stringify(st));LS.setItem('pc_hist',JSON.stringify(hist))};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
const teeBase=()=>st.atee!=null?st.atee:P.hm(st.tee);const T=()=>P.targets(teeBase(),P.parseDur(st.tgt)||250,st.course);
let h4was=null;const openCp=new Set();document.addEventListener('toggle',e=>{const el=e.target;if(el.classList&&el.classList.contains('cp')){const i=+el.dataset.i;el.open?openCp.add(i):openCp.delete(i)}},true);
const ready=()=>!!st.tee&&!!P.parseDur(st.tgt||'');
function render(){if(!ready()){$('set').open=true;h4was=null;$('tee').value=st.tee||'';$('tgt').value=st.tgt||'';$('course').value=st.course||'';$('grp').value=st.grp||'';$('sum').textContent='Setup Round';{const ww=window.WW||(window.WW=$('wwrap'));document.body.appendChild(ww);ww.style.display='none'}$('atee').innerHTML='';$('cps').innerHTML='<div class="card">Fill in <b>Target Round Duration</b> and <b>Scheduled Tee Time</b> above to start.</div>';if(typeof allocRender==='function')allocRender();live();if(typeof doneBox==='function')doneBox();return}const h4=st.act[0]!=null;if(h4was!==null&&h4!==h4was)$('set').open=!h4;if(h4was===null)$('set').open=!h4;h4was=h4;$('sum').textContent='Setup Round: '+[st.course,st.grp].filter(Boolean).join(', ')+(st.course||st.grp?' · ':'')+st.tgt+' target, tee '+P.fmt12(P.hm(st.tee));
 $('tee').value=st.tee;$('tgt').value=st.tgt;const t=T();let h='';
 let prev=0;HOLES.forEach((n,i)=>{const a=st.act[i];
  if(a!=null){const d=-Math.round(a-t[i])||0,seg=d-prev;prev=d;
   h+='<details class="card cp" data-i="'+i+'"'+(openCp.has(i)?' open':'')+'><summary class="row" style="cursor:pointer;list-style:none"><span>✓ Hole '+n+' · '+P.fmt12(a)+'</span><span class="d '+P.cls(-d)+'">'+P.sgn(d)+'</span></summary>'
    +'<div>Target '+P.fmt12(t[i])+' · Finished '+P.fmt12(a)+'</div>'
    +'<div>This stretch: <b>'+P.sgn(seg)+'</b> · Round total: <b>'+P.sgn(d)+'</b></div>'
    +'<button class="sm" onclick="ed('+i+')">Edit</button><button class="sm" onclick="un('+i+')">Undo</button></details>'}
  else h+='<div class="card" data-open="'+i+'"><div class="row"><span>Hole '+n+' by <b>'+P.fmt12(t[i])+'</b></span></div><button class="big" onclick="rec('+i+')">Finished hole '+n+'</button></div>'});
 const sch=P.hm(st.tee);$('atee').innerHTML=st.atee==null?'<div class="card"><div>Scheduled tee '+P.fmt12(sch)+'</div><button class="big" onclick="teeNow()">⛳ First tee shot hit</button></div>':(()=>{const dl=st.atee-sch;return '<details class="card"><summary class="row" style="cursor:pointer;list-style:none"><span>✓ Teed off '+P.fmt12(st.atee)+'</span><span>'+(dl===0?'on time':Math.abs(dl)+' min '+(dl>0?'late':'early'))+'</span></summary><div>Scheduled '+P.fmt12(sch)+' · Actual '+P.fmt12(st.atee)+'</div><button class="sm" onclick="teeEd()">Edit</button><button class="sm" onclick="teeUn()">Undo</button></details>'})();
 {const ww=window.WW||(window.WW=$('wwrap'));document.body.appendChild(ww)}
 if(typeof allocRender==='function'&&$('allocb'))allocRender();
 $('cps').innerHTML=h;{const ww=window.WW,nx=$('cps').querySelector('[data-open]');if(st.atee!=null&&nx){$('cps').insertBefore(ww,nx);ww.style.display='block'}else if(st.wait&&!nx){$('cps').appendChild(ww);ww.style.display='block'}else ww.style.display='none'}if(typeof doneBox==='function')doneBox();live();
 $('hist').innerHTML=hist.length?'<table><tr><th>Date</th><th>Tee</th><th>Tgt</th><th>4</th><th>9</th><th>13</th><th>18</th></tr>'+hist.slice().reverse().map(r=>'<tr><td>'+r.date+'</td><td>'+r.tee+'</td><td>'+r.tgt+'</td>'+r.delta.map(d=>'<td>'+(d==null?'':((-d||0)>0?'+':'')+(-d||0))+'</td>').join('')+'</tr>').join('')+'</table>':'<p>No saved rounds yet.</p>';
}
function pace(){const t=T(),i=st.act.findIndex(a=>a==null);let last=null,lh=0;st.act.forEach((a,k)=>{if(a!=null){last=-Math.round(a-t[k])||0;lh=HOLES[k]}});
 let v=last,src=lh?'as of hole '+lh:'';
 if(i>=0&&st.atee!=null){const over=nowMin()-t[i];if(over>0&&(v==null||-Math.round(over)<v)){v=-Math.round(over);src='live, hole '+HOLES[i]+' overdue'}}
 const el=$('pace');if(v==null){el.className='';el.innerHTML=st.atee==null?'Not teed off<small>Tap ⛳ when your first tee shot goes</small>':'On pace<small>no checkpoints yet</small>';return}
 el.className=v>=0?'g':v>=-5?'a':'r';el.innerHTML=(v===0?'ON PACE':Math.abs(v)+' min '+(v<0?'BEHIND':'AHEAD'))+'<small>'+src+' · target '+st.tgt+'</small>'}
function live(){if(!ready()){$('pace').className='';$('pace').innerHTML='Set up your round<small>Setup Round is at the top of the screen</small>';$('live').className='';$('live').textContent='Next: complete Setup Round';return}pace();const t=T(),i=st.act.findIndex(a=>a==null);if(i<0){const d=-Math.round(st.act[3]-t[3])||0;$('live').className='';$('live').textContent='Round done: '+P.sgn(d)+' vs '+st.tgt;return}
 const rem=t[i]-nowMin(),togo=Math.round(rem);$('live').className=rem<0?'r':rem<=5?'y':'';$('live').textContent='Next: hole '+HOLES[i]+' by '+P.fmt12(t[i])+' — '+(togo>=0?togo+' min to go':(-togo)+' min over')}
window.rec=i=>{if(i==3)st.dismiss=false;st.act[i]=Math.round(nowMin());save();render()};
window.un=i=>{st.act[i]=null;if(i==3)st.dismiss=false;save();render()};
window.ed=i=>{const v=prompt('Finish time (24h HH:MM)',(()=>{const m=st.act[i];return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')})());if(v&&/^\d{1,2}:\d{2}$/.test(v)){st.act[i]=P.hm(v);save();render()}};
$('dt').value=st.date;$('dt').onchange=e=>{st.date=e.target.value||st.date;save();render()};$('cap').value=st.cap||'';$('cap').onchange=e=>{st.cap=e.target.value.trim();save()};$('course').value=st.course||'';$('grp').value=st.grp||'';$('course').onchange=e=>{st.course=e.target.value.trim();save();render()};$('grp').onchange=e=>{st.grp=e.target.value.trim();save()};
$('tee').onchange=e=>{st.tee=e.target.value;save();render()};
$('tgt').onchange=e=>{const v=P.parseDur(e.target.value);if(v){st.tgt=P.fmtDur(v)}else if(e.target.value.trim()){alert('Enter the target like 4:10, or just 410')}save();render()};
$('rst').onclick=()=>{if(!confirm('Reset this round? Clears Course, Group Name, Target Round Duration, Scheduled Tee Time, the tee shot, all checkpoint times and waits. Saved history is kept.'))return;st={date:new Date().toISOString().slice(0,10),tee:'',tgt:'',course:'',grp:'',cap:st.cap||'',act:[null,null,null,null],atee:null,waits:[],wait:null};save();$('dt').value=st.date;render();wrender()};
$('clr').onclick=()=>{if(!confirm('Delete ALL saved rounds and waits on this phone? Share the CSVs first if you need them.'))return;if(!confirm('Are you sure? This cannot be undone.'))return;hist=[];save();render()};
window.teeNow=()=>{st.atee=Math.round(nowMin());save();render()};
window.teeUn=()=>{st.atee=null;save();render()};
window.teeEd=()=>{const m=st.atee;const v=prompt('Actual tee time (24h HH:MM)',String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));if(v&&/^\d{1,2}:\d{2}$/.test(v)){st.atee=P.hm(v);save();render()}};
function saveRound(){if(!st.act.some(a=>a!=null))return null;const t=T();const base=teeBase();
 const r={id:rid(),course:st.course||'',grp:st.grp||'',cap:st.cap||'',date:st.date,tee:P.fmt12(P.hm(st.tee)),atee:st.atee!=null?P.fmt12(st.atee):'',tdel:st.atee!=null?st.atee-P.hm(st.tee):'',tgt:st.tgt,act:st.act.map(a=>a==null?'':P.fmt12(a)),delta:st.act.map((a,i)=>a==null?null:Math.round(a-t[i])),waits:(st.waits||[]).slice(),rtime:st.act[3]!=null?P.fmtDur(st.act[3]-base):''};
 hist.push(r);st={date:new Date().toISOString().slice(0,10),tee:st.tee,tgt:st.tgt,act:[null,null,null,null],course:st.course,grp:st.grp,cap:st.cap,waits:[],wait:null,atee:null};save();$('dt').value=st.date;$('set').open=true;render();wrender();return r}

$('csv').onclick=()=>{const rows=[RH].concat(hist.map(rowR));
 if(rows.length<2){alert('No saved rounds yet. Finish a round first.');return}
 const q=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};const csv=rows.map(r=>r.map(q).join(',')).join('\n');
 const d=new Date().toISOString().slice(0,10);
 shareFiles([['wpgc-pace-rounds-'+d+'.csv',csv]],'WPGC Pace Rounds '+d)};
// icon + manifest
const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0b3d1e';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='bold 70px sans-serif';x.textAlign='center';x.fillText('4:10',90,115);
const icon=new URL('icon.png',location.href).href;
$('mf').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify({name:'WPGC Pace Card',short_name:'Pace Card',display:'standalone',background_color:'#0b3d1e',theme_color:'#0b3d1e',start_url:location.href,icons:[{src:icon,sizes:'180x180',type:'image/png'}]}));
render();setInterval(live,15000);
function allocRender(){const fr=courseFR(st.course),df=defFR(st.course),k=ckey(st.course),dur=P.parseDur(st.tgt)||250,pars=PARS[k];
 const pct=fr.map((f,i)=>(f-(i?fr[i-1]:0))*100),dp=df.map((f,i)=>(f-(i?df[i-1]:0))*100);
 let h='<p style="font-size:14px">Course: <b>'+(k[0].toUpperCase()+k.slice(1))+'</b>'+(pars?' (par 3 = 11, par 4 = 14, par 5 = 17 min weights)':' (Fraserview card)')+'</p><table><tr><th>Holes</th><th>Par</th><th>%</th><th>Min</th><th>Default</th></tr>';
 SEGS.forEach(([a,b],i)=>{const par=pars?pars.slice(a-1,b).reduce((x,y)=>x+y,0):'';
  h+='<tr><td>'+(a==1?'Tee':a)+'–'+b+'</td><td>'+par+'</td><td><input data-ai="'+i+'" inputmode="decimal" value="'+pct[i].toFixed(1)+'" style="width:64px;padding:6px;font-size:16px"></td><td>'+P.fmtDur(dur*pct[i]/100)+'</td><td>'+dp[i].toFixed(1)+'%</td></tr>'});
 const tot=pct.reduce((a,b)=>a+b,0);h+='<tr><td><b>Total</b></td><td>'+(pars?pars.reduce((x,y)=>x+y,0):'')+'</td><td><b>'+tot.toFixed(1)+'%</b></td><td><b>'+P.fmtDur(dur)+'</b></td><td></td></tr></table>';
 const custom=JSON.stringify(fr.map(x=>x.toFixed(4)))!==JSON.stringify(df.map(x=>x.toFixed(4)));
 h+='<p style="font-size:14px">'+(custom?'⚙️ Custom allocation in use for this course. ':'Using defaults. ')+'Edit any %; the others stay fixed and all four are rescaled to 100%.</p><button class="sm" id="adef">Reset to defaults</button><details style="margin-top:10px"><summary style="color:#9be7a5;text-decoration:underline;cursor:pointer">How are these calculated?</summary><div style="font-size:15px;line-height:1.4"><p><b>1. Each hole gets a time weight by par:</b> par 3 = 11 min, par 4 = 14 min, par 5 = 17 min. They are based on the published time-par guidelines below. Only the <i>ratio</i> between par 3s, 4s and 5s matters, because the total is always scaled to your Target Round Duration.</p><p><b>Sources:</b></p><ul style="padding-left:18px"><li><a style="color:#9be7a5" target="_blank" href="https://www.randa.org/pace-of-play/manual/6-appendices">R&amp;A Pace of Play Manual, Appendix C (time par)</a>: example four-ball times of 10, 13 and 16 min for par 3, 4 and 5.</li><li><a style="color:#9be7a5" target="_blank" href="https://assets.randa.org/c42c7bf4-dca7-00ea-4f2e-373223f80f76/bc16604e-b93a-4cc1-adca-4d4682a165ef/Pace%20of%20Play%20Policy%202025.pdf">R&amp;A Pace of Play Policy 2025</a>: base schedule of 11, 14 and 18 min.</li><li><a style="color:#9be7a5" target="_blank" href="https://www.usga.org/content/dam/usga/images/pace%20of%20play/Pace%20of%20Play%20Best%20Practices%20for%20OICs%20-%20Final2.pdf">USGA Pace of Play Best Practices</a>: 13, 15 and 17 min for threesomes.</li><li><a style="color:#9be7a5" target="_blank" href="https://www.golfcanada.ca/articles/quick-solution-golfs-pace-play-problem/">Golf Canada pace of play</a>: checkpoint approach (holes 5, 9, 14, 18).</li><li>Course pars: City of Vancouver scorecards for <a style="color:#9be7a5" target="_blank" href="https://vancouver.ca/files/cov/langara-golf-course-scorecard.pdf">Langara</a> and <a style="color:#9be7a5" target="_blank" href="https://vancouver.ca/files/cov/mccleery-golf-course-scorecard.pdf">McCleery</a>; <a style="color:#9be7a5" target="_blank" href="https://kamloopsgolfclub.com/golf-course/hole-overview/">Kamloops Golf and Country Club</a>.</li></ul><p>The 11/14/17 split sits between these: the R&amp;A\'s par 3 and par 4 times, with the par 5 rounded to keep an even 3-minute step.</p><p><b>2. Weights are added up per interval</b> (Tee–4, 5–9, 10–13, 14–18). On Langara, holes 1–4 are par 4, 3, 5, 4, so 14+11+17+14 = 56. The whole course adds up to 249.</p><p><b>3. Each interval\'s share = its weight ÷ the course total.</b> Langara holes 1–4: 56 ÷ 249 = 22.5%.</p><p><b>4. That share is applied to your Target Round Duration.</b> 22.5% of 4:10 (250 min) = 56 min, so hole 4 is due 56 min after your actual tee time (or scheduled tee time if you haven\'t tapped ⛳).</p><p><b>Why holes 4, 9, 13 and 18?</b> They split the round into four similar chunks, with 9 marking the turn, so drift shows up early but you\'re not tapping on every hole. They\'re the same at every course so results can be compared.</p><p><b>Fraserview</b> uses the original Fraserview Pace Card split of 0:59, 2:05, 3:01 and 4:10 at a 4:10 target.</p><p><b>Tuning:</b> if a course plays slower in one stretch (for example a long walk between greens and tees), raise that interval\'s %. The others are rescaled so the total stays 100% of your target.</p></div></details>';
 $('allocb').innerHTML=h;
 $('allocb').querySelectorAll('[data-ai]').forEach(inp=>inp.onchange=()=>{const v=[...$('allocb').querySelectorAll('[data-ai]')].map(x=>Math.max(1,parseFloat(x.value)||0));const s=v.reduce((a,b)=>a+b,0);let c=0;const f=v.map(x=>(c+=x/s));f[3]=1;
  const o=JSON.parse(localStorage.getItem('pc_alloc')||'{}');o[k]=f;localStorage.setItem('pc_alloc',JSON.stringify(o));render()});
 $('adef').onclick=()=>{const o=JSON.parse(localStorage.getItem('pc_alloc')||'{}');delete o[k];localStorage.setItem('pc_alloc',JSON.stringify(o));render()}}
allocRender();
const RH=['course','group','captain_email','date','sched_tee','actual_tee','tee_delay_min','target','round_time','h4','h9','h13','h18','d4','d9','d13','d18','total_wait_min','wait_count'],WH=['course','date','group','captain_email','sched_tee','actual_tee','wait_no','start','end','wait_mmss','wait_min','stretch','comment'];
function rowR(r){return [r.course||'',r.grp||'',r.cap||'',r.date,r.tee,r.atee||'',r.tdel==null?'':r.tdel,r.tgt,r.rtime||'',...r.act,...r.delta.map(d=>d==null?'':(-d||0)),wmin((r.waits||[]).reduce((s,w)=>s+w.secs,0)),(r.waits||[]).length]}
function rowsW(r){return (r.waits||[]).map((w,i)=>[r.course||'',r.date,r.grp||'',r.cap||'',r.tee,r.atee||'',i+1,hhmm(w.start),hhmm(w.end),mss(w.secs),wmin(w.secs),w.stretch||'',w.comment||''])}
const toCSV=rows=>rows.map(r=>r.map(qv).join(',')).join('\n');
function doneBox(){const box=$('done');if(st.act[3]==null||st.dismiss){box.style.display='none';$('reopen').style.display=st.act[3]!=null?'inline-block':'none';return}
 $('reopen').style.display='none';const t=T(),d=-Math.round(st.act[3]-t[3])||0,rt=st.act[3]-teeBase(),ws=st.waits||[],tw=ws.reduce((s,w)=>s+w.secs,0);
 $('donebody').innerHTML='<div style="font-size:30px;font-weight:900;text-align:center;padding:10px;border-radius:12px" class="'+(d>=0?'g':d>=-5?'a':'r')+'">'+(d===0?'ON PACE':Math.abs(d)+' min '+(d<0?'BEHIND':'AHEAD'))+'</div>'
  +'<p>'+[st.course,st.grp,st.date].filter(Boolean).join(' · ')+'</p>'
  +'<p>Round time <b>'+P.fmtDur(rt)+'</b> vs target <b>'+st.tgt+'</b></p>'
  +'<p>Teed off <b>'+P.fmt12(teeBase())+'</b>'+(st.atee!=null?' (scheduled '+P.fmt12(P.hm(st.tee))+')':' (scheduled time, tee shot not tapped)')+'</p>'
  +'<p>Waits <b>'+ws.length+'</b> · total <b>'+mss(tw)+'</b>'+(st.wait?' <i>(a wait is still running and will be stopped)</i>':'')+'</p>';
 box.style.display='flex'}
$('dsend').onclick=()=>{if(st.wait)$('wbtn').onclick();const r=saveRound();if(!r)return;
 const tag=fslug([r.date,r.course,r.grp]);const f=[['wpgc-pace-round-'+tag+'.csv',toCSV([RH,rowR(r)])]];if(r.waits.length)f.push(['wpgc-wait-log-'+tag+'.csv',toCSV([WH].concat(rowsW(r)))]);
 upload(r);shareFiles(f,'WPGC Pace Round '+[r.course,r.grp,r.date].filter(Boolean).join(' - '))};
$('dsave').onclick=()=>{if(st.wait)$('wbtn').onclick();const r=saveRound();if(r)upload(r)};
$('dlater').onclick=()=>{st.dismiss=true;save();doneBox()};
$('reopen').onclick=()=>{st.dismiss=false;save();doneBox()};

function wmin(s){return (s/60).toFixed(1)}
function mss(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function qv(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
const fslug=a=>a.filter(Boolean).join('-').replace(/[^A-Za-z0-9-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'');
async function shareFiles(list,title){const files=list.map(([n,c])=>new File([c],n,{type:'text/csv'}));
 try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files,title,text:title});return}}catch(e){if(e&&e.name==='AbortError')return}
 list.forEach(([n,c])=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/csv'}));a.download=n;document.body.appendChild(a);a.click();a.remove()})}
const hhmm=ms=>{const d=new Date(ms);return P.fmt12(d.getHours()*60+d.getMinutes())};
function stretch(){const i=st.act.findIndex(a=>a==null);return i<0?'after 18':i==0?'holes 1-4':'holes '+(HOLES[i-1]+1)+'-'+HOLES[i]}
['Teebox ','Fairway, waiting for green','Par 3 tee'].forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c.trim();b.onclick=()=>{$('wcom').value=c;$('wcom').focus();if(st.wait){st.wait.comment=c;save()}};$('chips').appendChild(b)});
$('wcom').oninput=e=>{if(st.wait){st.wait.comment=e.target.value;save()}};
$('wbtn').onclick=()=>{st.waits=st.waits||[];
 if(!st.wait){st.wait={start:Date.now(),comment:'',stretch:stretch()};$('wcom').value=''}
 else{const w=st.wait;w.end=Date.now();w.secs=Math.round((w.end-w.start)/1000);w.comment=$('wcom').value.trim();st.waits.push(w);st.wait=null}
 save();wrender()};
window.wedit=i=>{const c=prompt('Comment for wait '+(i+1),st.waits[i].comment||'');if(c!=null){st.waits[i].comment=c.trim();save();wrender()}};
window.wdel=i=>{if(confirm('Delete this wait?')){st.waits.splice(i,1);save();wrender()}};
function wrender(){const on=!!st.wait;$('wbtn').className=on?'on':'';$('wbox').style.display=on?'block':'none';
 $('wbtn').textContent=on?'■ Stop Waiting  '+mss((Date.now()-st.wait.start)/1000):'⏸ Start Waiting';
 const ws=st.waits||[];const tot=ws.reduce((s,w)=>s+w.secs,0);
 $('wlist').innerHTML=ws.length?'<details class="card"><summary style="font-weight:800;cursor:pointer">Waits this round: '+ws.length+' · total '+mss(tot)+'</summary>'+ws.map((w,i)=>'<div class="wrow"><div class="wtxt"><div><b>'+mss(w.secs)+'</b> <span class="wt">at '+hhmm(w.start)+'</span></div><div class="wc">'+(w.comment||'<i>no comment</i>')+'</div></div><div class="wbtns"><button class="wb" onclick="wedit('+i+')" aria-label="Edit">✎</button><button class="wb" onclick="wdel('+i+')" aria-label="Delete">✕</button></div></div>').join('')+'</details>':''}
$('wcsv').onclick=()=>{const rows=[WH];hist.forEach(r=>rowsW(r).forEach(x=>rows.push(x)));
 if(rows.length<2){alert('No waits in saved rounds yet. Finish a round first.');return}
 const d=new Date().toISOString().slice(0,10);shareFiles([['wpgc-wait-log-'+d+'.csv',toCSV(rows)]],'WPGC Wait Log '+d)};
setInterval(()=>{if(st.wait)wrender()},1000);
// --- automatic upload to Drawmaster Pace Log sheet ---
function rid(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)}
function payload(r){const o={},w=[];RH.forEach((k,i)=>o[k]=rowR(r)[i]);o.round_id=r.id;o.app_version=APP_VERSION;
 rowsW(r).forEach(x=>{const z={};WH.forEach((k,i)=>z[k]=x[i]);w.push(z)});return {round:o,waits:w}}
function upMsg(t){const e=$('upst');e.textContent=t;e.style.display=t?'block':'none'}
async function upload(r){if(!UPLOAD_URL)return;if(!r.id){r.id=rid();save()}
 if(!navigator.onLine){r.upq=true;save();upMsg('📶 Will send to Drawmaster when online');return}
 try{await fetch(UPLOAD_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload(r))});
  r.uploaded=true;delete r.upq;save();upMsg('Sent to Drawmaster ✓')}
 catch(e){r.upq=true;save();upMsg('📶 Will send to Drawmaster when online')}}
async function retryUploads(){if(!UPLOAD_URL||!navigator.onLine)return;for(const r of hist.filter(r=>r.upq&&!r.uploaded))await upload(r)}
window.addEventListener('online',retryUploads);retryUploads();
wrender();
}
</script><script>(function(){const c=document.getElementById("setcard");const f=()=>{const v=id=>(document.getElementById(id).value||"").trim();c.classList.toggle("unset",!(v("course")&&v("tgt")&&v("tee")))};document.addEventListener("input",f);document.addEventListener("change",f);document.addEventListener("click",()=>setTimeout(f,0));document.getElementById("sdone").addEventListener("click",()=>{document.getElementById("set").open=false;window.scrollTo(0,0)});f()})();</script></body></html>
