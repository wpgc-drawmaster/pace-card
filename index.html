<script>
const HOLES=[4,9,13,18],SEGS=[[1,4],[5,9],[10,13],[14,18]];
const PARS={langara:[4,3,5,4,4,4,4,3,4,4,5,3,4,3,4,5,4,4],mccleery:[5,4,3,4,3,4,3,4,5,4,5,4,3,5,4,3,4,4],kamloops:[4,5,3,4,4,5,4,3,4,4,4,5,3,4,3,4,4,5],'burnaby mountain':[5,4,5,3,4,3,4,4,4,4,4,4,3,4,3,5,4,4],riverway:[4,4,5,4,5,3,4,3,4,4,3,4,5,4,3,4,4,5]};
const W={3:11,4:14,5:17};
const COURSE_NAMES={fraserview:'Fraserview',langara:'Langara',mccleery:'McCleery',kamloops:'Kamloops Golf and Country Club','burnaby mountain':'Burnaby Mountain Golf Course',riverway:'Riverway Golf Course'};
function ckey(course){const c=(course||'').toLowerCase();return Object.keys(PARS).find(k=>c.includes(k))||'fraserview'}
function defFR(course){const k=ckey(course);if(!PARS[k])return [59/250,125/250,181/250,1];
 const w=PARS[k].map(p=>W[p]);const cum=HOLES.map(h=>w.slice(0,h).reduce((a,b)=>a+b,0));return cum.map(x=>x/cum[3])}
function courseFR(course){try{const o=JSON.parse(localStorage.getItem('pc_alloc')||'{}')[ckey(course)];if(o&&o.length==4)return o}catch(e){}return defFR(course)}
function ACT(h){return h==='F9'?[0,1]:h==='B9'?[2,3]:[0,1,2,3]}
function modeFR(course,h){const f=courseFR(course);if(h==='F9')return [f[0]/f[1],1,null,null];if(h==='B9')return [null,null,(f[2]-f[1])/(1-f[1]),1];return f}
const P={
 parseDur(s){s=String(s||'').trim();let m=s.match(/^(\d{1,2})\D+(\d{1,2})$/);if(!m){const d=s.replace(/\D/g,'');if(/^\d{3}$/.test(d))m=[0,d[0],d.slice(1)];else if(/^\d{4}$/.test(d))m=[0,d.slice(0,2),d.slice(2)];else if(/^\d{1}$/.test(d))m=[0,d,'0']}if(!m||+m[2]>59)return null;const v=(+m[1])*60+(+m[2]);return v>=60&&v<=480?v:null},
 fmtDur(m){m=Math.round(m);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')},
 fmt12(min){min=((Math.round(min)%1440)+1440)%1440;let h=Math.floor(min/60),mm=min%60;const ap=h<12?'am':'pm';h=h%12||12;return h+':'+String(mm).padStart(2,'0')+ap},

 targets(tee,dur,course,h){return modeFR(course,h).map(f=>f==null?null:tee+Math.round(dur*f))},

 sgn(d){return (d>0?'+':d<0?'−':'±')+Math.abs(d)+' min'}
};
if(typeof module!=='undefined'){module.exports=P}
if(typeof document!=='undefined'){
const $=id=>document.getElementById(id),LS=localStorage;
let st=JSON.parse(LS.getItem('pc_cur')||'null')||{date:new Date().toISOString().slice(0,10),tee:'09:54',tgt:'4:10',act:[null,null,null,null]};
window.__st=()=>st;window.__P=P;
{const sel=document.getElementById('course');Object.values(COURSE_NAMES).forEach(n=>{const o=document.createElement('option');o.value=o.textContent=n;sel.appendChild(o)});if(st.course){const c=st.course.toLowerCase(),k=Object.keys(COURSE_NAMES).find(k=>c.includes(k));st.course=k?COURSE_NAMES[k]:'';LS.setItem('pc_cur',JSON.stringify(st))}}
let hist=JSON.parse(LS.getItem('pc_hist')||'[]');
const UPLOAD_URL='https://script.google.com/macros/s/AKfycbz2yNO0msfE8xX8awzvjj226hAWziWcxx-qlZRNMqiEpfcTRm58yGQFUoB8K3Y9j2AJ/exec';// Drawmaster Apps Script /exec URL (set after deployment)
const APP_VERSION=14;const APP_BUILD='2026-Oct-15:16:46';window.APPV='Version '+APP_VERSION+' · '+APP_BUILD;// single source of truth; bumped by release.sh
const save=()=>{LS.setItem('pc_cur',JSON.stringify(st));LS.setItem('pc_hist',JSON.stringify(hist))};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
const teeBase=()=>st.atee!=null?st.atee:P.hm(st.tee);const HM=()=>st.holes||'18',LAST=()=>ACT(HM()).slice(-1)[0],NEXT=()=>{const a=ACT(HM()).find(k=>st.act[k]==null);return a==null?-1:a};
const T=()=>P.targets(teeBase(),P.parseDur(st.tgt)||(HM()==='18'?250:125),st.course,HM());
let h4was=null;const openCp=new Set();document.addEventListener('toggle',e=>{const el=e.target;if(el.classList&&el.classList.contains('cp')){const i=+el.dataset.i;el.open?openCp.add(i):openCp.delete(i)}},true);
const ready=()=>!!st.tee&&!!P.parseDur(st.tgt||'')&&(!!st.course||st.atee!=null);
function render(){if(!ready()){$('set').open=true;h4was=null;$('tee').value=st.tee||'';$('tgt').value=st.tgt||'';$('course').value=st.course||'';$('holes').value=HM();$('grp').value=st.grp||'';$('sum').textContent='Setup Round';{const ww=window.WW||(window.WW=$('wwrap'));document.body.appendChild(ww);ww.style.display='none'}$('atee').innerHTML='';$('cps').innerHTML='<div class="card">Choose a <b>Course</b> and fill in <b>Target Round Duration</b> and <b>Scheduled Tee Time</b> above to start.</div>';if(typeof allocRender==='function')allocRender();live();if(typeof doneBox==='function')doneBox();return}const h4=st.act[0]!=null;if(h4was!==null&&h4!==h4was)$('set').open=!h4;if(h4was===null)$('set').open=!h4;h4was=h4;$('sum').textContent='Setup Round: '+[st.course||'⚠️ choose a course',st.grp].filter(Boolean).join(', ')+(st.course||st.grp?' · ':'')+(HM()==='18'?'':(HM()==='F9'?'Front 9 · ':'Back 9 · '))+st.tgt+' target, tee '+P.fmt12(P.hm(st.tee));
 $('tee').value=st.tee;$('tgt').value=st.tgt;const t=T();let h='';
 let prev=0;HOLES.forEach((n,i)=>{if(!ACT(HM()).includes(i))return;const a=st.act[i];
  if(a!=null){const d=-Math.round(a-t[i])||0,seg=d-prev;prev=d;
   h+='<details class="card cp" data-i="'+i+'"'+(openCp.has(i)?' open':'')+'><summary class="row" style="cursor:pointer;list-style:none"><span>✓ Hole '+n+' · '+P.fmt12(a)+'</span><span class="d '+P.cls(-d)+'">'+P.sgn(d)+'</span></summary>'
    +'<div>Target '+P.fmt12(t[i])+' · Finished '+P.fmt12(a)+'</div>'
    +'<div>This stretch: <b>'+P.sgn(seg)+'</b> · Round total: <b>'+P.sgn(d)+'</b></div>'
    +'<button class="sm" onclick="ed('+i+')">Edit</button><button class="sm" onclick="un('+i+')">Undo</button></details>'}
  else h+='<div class="card" data-open="'+i+'"><div class="row"><span>Hole '+n+' by <b>'+P.fmt12(t[i])+'</b></span></div><button class="big" onclick="rec('+i+')">Finished hole '+n+'</button></div>'});
 const sch=P.hm(st.tee);$('atee').innerHTML=st.atee==null?'<div class="card"><div>Scheduled tee '+P.fmt12(sch)+'</div><button class="big" id="teeb" onclick="teeNow()">⛳ First tee shot hit<span id="tcd" style="display:none;font-size:16px;font-weight:700;margin-top:4px"></span></button></div>':(()=>{const dl=st.atee-sch;return '<details class="card"><summary class="row" style="cursor:pointer;list-style:none"><span>✓ Teed off '+P.fmt12(st.atee)+'</span><span>'+(dl===0?'on time':Math.abs(dl)+' min '+(dl>0?'late':'early'))+'</span></summary><div>Scheduled '+P.fmt12(sch)+' · Actual '+P.fmt12(st.atee)+'</div><button class="sm" onclick="teeEd()">Edit</button><button class="sm" onclick="teeUn()">Undo</button></details>'})();
 {const ww=window.WW||(window.WW=$('wwrap'));document.body.appendChild(ww)}
 if(typeof allocRender==='function'&&$('allocb'))allocRender();
 $('cps').innerHTML=h;{const ww=window.WW,nx=$('cps').querySelector('[data-open]');if(st.atee!=null&&nx){$('cps').insertBefore(ww,nx);ww.style.display='block'}else if(st.wait&&!nx){$('cps').appendChild(ww);ww.style.display='block'}else ww.style.display='none'}if(typeof doneBox==='function')doneBox();live();
 $('hist').innerHTML=hist.length?'<table><tr><th>Date</th><th>Tee</th><th>Tgt</th><th>4</th><th>9</th><th>13</th><th>18</th></tr>'+hist.slice().reverse().map(r=>'<tr><td>'+r.date+'</td><td>'+r.tee+'</td><td>'+r.tgt+'</td>'+r.delta.map(d=>'<td>'+(d==null?'':((-d||0)>0?'+':'')+(-d||0))+'</td>').join('')+'</tr>').join('')+'</table>':'<p>No saved rounds yet.</p>';
}

 let v=last,src=lh?'at hole '+lh:'';
 if(i>=0&&st.atee!=null){const over=nowMin()-t[i];if(over>0&&(v==null||-Math.round(over)<v)){v=-Math.round(over);src='heading to hole '+HOLES[i]+', running late'}}
 const el=$('pace');if(v==null){el.className='';el.innerHTML=st.atee==null?'Not teed off<small>Tap ⛳ when your first tee shot goes</small>':'ON PACE<small>heading to hole '+HOLES[i<0?LAST():i]+' · round target '+st.tgt+'</small>';return}
 el.className=v>=0?'g':v>=-5?'a':'r';el.innerHTML=(v===0?'ON PACE':Math.abs(v)+' min '+(v<0?'BEHIND':'AHEAD'))+'<small>'+src+' · round target '+st.tgt+'</small>'}
function nxGlow(i,c){document.querySelectorAll('button.nx').forEach(b=>{if(i<0||b!==nxB())b.className='big'});const b=nxB();if(!b||i<0||st.atee==null){window.NXS=null;return}const k=i+':'+c,pv=window.NXS;window.NXS=k;let p=Date.now()<(window.NXP||0);if(pv!==undefined&&pv!==null&&pv!==k&&c&&pv.split(':')[0]==String(i)){p=true;window.NXP=Date.now()+1100;clearTimeout(window.NXT);window.NXT=setTimeout(()=>{const x=nxB();if(x)x.classList.remove('p')},1100)}else if(pv!==k){p=false;window.NXP=0}b.className='big nx'+(c?' '+c:'')+(p?' p':'')}
function nxB(){return document.querySelector('#cps [data-open] button')}
