<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pace Card">
<meta name="theme-color" content="#0b3d1e">
<title>WPGC Pace Card</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="manifest" id="mf">
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:#0b3d1e;color:#fff;padding:env(safe-area-inset-top) 12px 40px;font-size:18px}
h1{font-size:24px;margin:12px 0}h2{font-size:20px;margin:18px 0 8px}
#live.y{background:#ffd60a!important;color:#000!important}#live.r{background:#ff3b30!important;color:#fff!important}
#pace{font-size:34px;font-weight:900;text-align:center;padding:16px 10px;border-radius:14px;margin-bottom:8px;background:#fff;color:#0b3d1e}#pace small{display:block;font-size:15px;font-weight:700}#pace.g{background:#2ecc40;color:#000}#pace.a{background:#ffd60a;color:#000}#pace.r{background:#ff3b30;color:#fff}
#live{background:#fff;color:#0b3d1e;font-weight:800;font-size:22px;padding:14px;border-radius:12px;}
.card{background:#145c2e;border-radius:12px;padding:12px;margin:10px 0}
label{display:block;font-weight:700;margin:6px 0}input{font-size:22px;padding:10px;border-radius:8px;border:2px solid #fff;width:100%}
button{font-size:20px;font-weight:800;border:0;border-radius:12px;padding:14px;min-height:56px;cursor:pointer}
#wbtn{width:100%;font-size:24px;min-height:72px;margin-top:10px;background:#ff9f0a;color:#000;font-weight:900;border-radius:12px;border:0}#wbtn.on{background:#ff3b30;color:#fff}
.chip{background:#e8f5e9;color:#0b3d1e;border:0;border-radius:16px;padding:6px 10px;margin:4px 4px 0 0;font-size:15px}
.big{width:100%;background:#fff;color:#0b3d1e;font-size:24px;min-height:72px}
.sm{background:#e8f5e9;color:#0b3d1e;font-size:16px;min-height:44px;padding:8px 12px;margin:4px 4px 0 0}
.row{display:flex;justify-content:space-between;align-items:center;font-size:20px;margin-bottom:8px}
.d{font-weight:900;padding:4px 10px;border-radius:8px}.g{background:#2ecc40;color:#000}.a{background:#ffb300;color:#000}.r{background:#ff3b30;color:#fff}
table{width:100%;border-collapse:collapse;font-size:15px}td,th{border-bottom:1px solid #2e7d4f;padding:4px;text-align:left}
</style></head><body>
<h1 style="display:flex;align-items:center;gap:10px"><img src="logo.png" alt="WPGC" style="width:44px;height:44px;border-radius:50%">WPGC Pace Card</h1>
<div style="position:sticky;top:0;z-index:3;background:#0b3d1e;padding-bottom:6px"><div id="pace">—</div><div id="live">—</div></div>
<button id="wbtn">⏸ Start Wait</button>
<div id="wbox" class="card" style="display:none">
<label>Wait comment<input id="wcom" placeholder="e.g. Teebox 3"></label>
<div id="chips"></div>
</div>
<div id="wlist"></div>
<div class="card">
<details id="set" open><summary id="sum" style="font-weight:800;cursor:pointer;padding:6px 0">Setup Round</summary>
<label>Date<input id="dt" type="date"></label>
<label>Course<input id="course" list="courses" placeholder="Fraserview, Langara or McCleery"><datalist id="courses"><option value="Fraserview"><option value="Langara"><option value="McCleery"></datalist></label>
<label>Group Name<input id="grp" placeholder="e.g. Group 7"></label>
<label>Target Round Duration (h:mm)<input id="tgt" inputmode="numeric" value="4:10"></label>
<label>Scheduled Tee Time<input id="tee" type="time" value="09:54"></label>
<label>Captain Email (optional)<input id="cap" type="email" placeholder="captain@example.com"></label>
</details>
<button class="sm" id="newr">Save &amp; new round</button> <button class="sm" id="rst">Reset round</button> <button class="sm" id="clr" style="background:#ffdad6">Clear all history</button>
</div>
<div id="atee"></div>
<div id="cps"></div>
<h2>History</h2>
<label>Also email to (optional)<input id="cc" type="email" placeholder="name@example.com"></label>
<button class="sm" id="csv">Email CSV</button> <button class="sm" id="wcsv">Email Wait Log CSV</button>
<div id="hist"></div>
<script>
const HOLES=[4,9,13,18];
const PARS={langara:[4,3,5,4,4,4,4,3,4,4,5,3,4,3,4,5,4,4],mccleery:[5,4,3,4,3,4,3,4,5,4,5,4,3,5,4,3,4,4]};
const W={3:11,4:14,5:17};
function courseFR(course){const c=(course||'').toLowerCase();const k=Object.keys(PARS).find(k=>c.includes(k));if(!k)return [59/250,125/250,181/250,1];
 const w=PARS[k].map(p=>W[p]);const cum=HOLES.map(h=>w.slice(0,h).reduce((a,b)=>a+b,0));return cum.map(x=>x/cum[3])}
const P={
 parseDur(s){const m=String(s).trim().match(/^(\d+):(\d{1,2})$/);return m?(+m[1])*60+(+m[2]):null},
 fmtDur(m){m=Math.round(m);return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')},
 fmt12(min){min=((Math.round(min)%1440)+1440)%1440;let h=Math.floor(min/60),mm=min%60;const ap=h<12?'am':'pm';h=h%12||12;return h+':'+String(mm).padStart(2,'0')+ap},
 hm(s){const[a,b]=s.split(':');return +a*60+ +b},
 targets(tee,dur,course){return courseFR(course).map(f=>tee+Math.round(dur*f))},
 cls(d){return d<=2?'g':d<=5?'a':'r'},
 sgn(d){return (d>0?'+':d<0?'−':'±')+Math.abs(d)+' min'}
};
if(typeof module!=='undefined'){module.exports=P}
if(typeof document!=='undefined'){
const $=id=>document.getElementById(id),LS=localStorage;
let st=JSON.parse(LS.getItem('pc_cur')||'null')||{date:new Date().toISOString().slice(0,10),tee:'09:54',tgt:'4:10',act:[null,null,null,null]};
let hist=JSON.parse(LS.getItem('pc_hist')||'[]');
const save=()=>{LS.setItem('pc_cur',JSON.stringify(st));LS.setItem('pc_hist',JSON.stringify(hist))};
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()+d.getSeconds()/60};
const teeBase=()=>st.atee!=null?st.atee:P.hm(st.tee);const T=()=>P.targets(teeBase(),P.parseDur(st.tgt)||250,st.course);
let h4was=null;const openCp=new Set();document.addEventListener('toggle',e=>{const el=e.target;if(el.classList&&el.classList.contains('cp')){const i=+el.dataset.i;el.open?openCp.add(i):openCp.delete(i)}},true);
function render(){const h4=st.act[0]!=null;if(h4was!==null&&h4!==h4was)$('set').open=!h4;if(h4was===null)$('set').open=!h4;h4was=h4;$('sum').textContent='Setup Round: '+[st.course,st.grp].filter(Boolean).join(', ')+(st.course||st.grp?' · ':'')+st.tgt+' target, tee '+P.fmt12(P.hm(st.tee));
 $('tee').value=st.tee;$('tgt').value=st.tgt;const t=T();let h='';
 let prev=0;HOLES.forEach((n,i)=>{const a=st.act[i];
  if(a!=null){const d=-Math.round(a-t[i])||0,seg=d-prev;prev=d;
   h+='<details class="card cp" data-i="'+i+'"'+(openCp.has(i)?' open':'')+'><summary class="row" style="cursor:pointer;list-style:none"><span>✓ Hole '+n+' · '+P.fmt12(a)+'</span><span class="d '+P.cls(-d)+'">'+P.sgn(d)+'</span></summary>'
    +'<div>Target '+P.fmt12(t[i])+' · Finished '+P.fmt12(a)+'</div>'
    +'<div>This stretch: <b>'+P.sgn(seg)+'</b> · Round total: <b>'+P.sgn(d)+'</b></div>'
    +'<button class="sm" onclick="ed('+i+')">Edit</button><button class="sm" onclick="un('+i+')">Undo</button></details>'}
  else h+='<div class="card"><div class="row"><span>Hole '+n+' by <b>'+P.fmt12(t[i])+'</b></span></div><button class="big" onclick="rec('+i+')">Finished hole '+n+'</button></div>'});
 const sch=P.hm(st.tee);$('atee').innerHTML=st.atee==null?'<div class="card"><div>Scheduled tee '+P.fmt12(sch)+'</div><button class="big" onclick="teeNow()">⛳ First tee shot hit</button></div>':(()=>{const dl=st.atee-sch;return '<details class="card"><summary class="row" style="cursor:pointer;list-style:none"><span>✓ Teed off '+P.fmt12(st.atee)+'</span><span>'+(dl===0?'on time':Math.abs(dl)+' min '+(dl>0?'late':'early'))+'</span></summary><div>Scheduled '+P.fmt12(sch)+' · Actual '+P.fmt12(st.atee)+'</div><button class="sm" onclick="teeEd()">Edit</button><button class="sm" onclick="teeUn()">Undo</button></details>'})();
 $('cps').innerHTML=h;live();
 $('hist').innerHTML=hist.length?'<table><tr><th>Date</th><th>Tee</th><th>Tgt</th><th>4</th><th>9</th><th>13</th><th>18</th></tr>'+hist.slice().reverse().map(r=>'<tr><td>'+r.date+'</td><td>'+r.tee+'</td><td>'+r.tgt+'</td>'+r.delta.map(d=>'<td>'+(d==null?'':((-d||0)>0?'+':'')+(-d||0))+'</td>').join('')+'</tr>').join('')+'</table>':'<p>No saved rounds yet.</p>';
}
function pace(){const t=T(),i=st.act.findIndex(a=>a==null);let last=null,lh=0;st.act.forEach((a,k)=>{if(a!=null){last=-Math.round(a-t[k])||0;lh=HOLES[k]}});
 let v=last,src=lh?'as of hole '+lh:'';
 if(i>=0&&st.atee!=null){const over=nowMin()-t[i];if(over>0&&(v==null||-Math.round(over)<v)){v=-Math.round(over);src='live, hole '+HOLES[i]+' overdue'}}
 const el=$('pace');if(v==null){el.className='';el.innerHTML=st.atee==null?'Not teed off<small>Tap ⛳ when your first tee shot goes</small>':'On pace<small>no checkpoints yet</small>';return}
 el.className=v>=0?'g':v>=-5?'a':'r';el.innerHTML=(v===0?'ON PACE':Math.abs(v)+' min '+(v<0?'BEHIND':'AHEAD'))+'<small>'+src+' · target '+st.tgt+'</small>'}
function live(){pace();const t=T(),i=st.act.findIndex(a=>a==null);if(i<0){const d=-Math.round(st.act[3]-t[3])||0;$('live').className='';$('live').textContent='Round done: '+P.sgn(d)+' vs '+st.tgt;return}
 const rem=t[i]-nowMin(),togo=Math.round(rem);$('live').className=rem<0?'r':rem<=5?'y':'';$('live').textContent='Next: hole '+HOLES[i]+' by '+P.fmt12(t[i])+' — '+(togo>=0?togo+' min to go':(-togo)+' min over')}
window.rec=i=>{st.act[i]=Math.round(nowMin());save();render()};
window.un=i=>{st.act[i]=null;save();render()};
window.ed=i=>{const v=prompt('Finish time (24h HH:MM)',(()=>{const m=st.act[i];return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')})());if(v&&/^\d{1,2}:\d{2}$/.test(v)){st.act[i]=P.hm(v);save();render()}};
$('dt').value=st.date;$('dt').onchange=e=>{st.date=e.target.value||st.date;save();render()};$('cap').value=st.cap||'';$('cap').onchange=e=>{st.cap=e.target.value.trim();save()};$('course').value=st.course||'';$('grp').value=st.grp||'';$('course').onchange=e=>{st.course=e.target.value.trim();save();render()};$('grp').onchange=e=>{st.grp=e.target.value.trim();save()};
$('tee').onchange=e=>{st.tee=e.target.value||st.tee;save();render()};
$('tgt').onchange=e=>{if(P.parseDur(e.target.value)){st.tgt=e.target.value}save();render()};
$('rst').onclick=()=>{if(!confirm('Reset this round? Clears the tee shot, all checkpoint times and waits. Setup info is kept.'))return;st.act=[null,null,null,null];st.atee=null;st.waits=[];st.wait=null;save();$('set').open=true;render();wrender()};
$('clr').onclick=()=>{if(!confirm('Delete ALL saved rounds and waits on this phone? Email the CSVs first if you need them.'))return;if(!confirm('Are you sure? This cannot be undone.'))return;hist=[];save();render()};
window.teeNow=()=>{st.atee=Math.round(nowMin());save();render()};
window.teeUn=()=>{st.atee=null;save();render()};
window.teeEd=()=>{const m=st.atee;const v=prompt('Actual tee time (24h HH:MM)',String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'));if(v&&/^\d{1,2}:\d{2}$/.test(v)){st.atee=P.hm(v);save();render()}};
$('newr').onclick=()=>{if(st.act.some(a=>a!=null)){const t=T();hist.push({course:st.course||'',grp:st.grp||'',cap:st.cap||'',date:st.date,tee:P.fmt12(P.hm(st.tee)),atee:st.atee!=null?P.fmt12(st.atee):'',tdel:st.atee!=null?st.atee-P.hm(st.tee):'',tgt:st.tgt,act:st.act.map(a=>a==null?'':P.fmt12(a)),delta:st.act.map((a,i)=>a==null?null:Math.round(a-t[i])),waits:(st.waits||[]).slice()})}
 st={date:new Date().toISOString().slice(0,10),tee:st.tee,tgt:st.tgt,act:[null,null,null,null],course:st.course,grp:st.grp,cap:st.cap,waits:[],wait:null,atee:null};save();$('dt').value=st.date;render()};
$('cc').value=LS.getItem('pc_cc')||'';$('cc').onchange=e=>LS.setItem('pc_cc',e.target.value.trim());
$('csv').onclick=()=>{const rows=[['course','group','captain_email','date','sched_tee','actual_tee','tee_delay_min','target','h4','h9','h13','h18','d4','d9','d13','d18','total_wait_min','wait_count']].concat(hist.map(r=>[r.course||'',r.grp||'',r.cap||'',r.date,r.tee,r.atee||'',r.tdel==null?'':r.tdel,r.tgt,...r.act,...r.delta.map(d=>d==null?'':(-d||0)),wmin((r.waits||[]).reduce((s,w)=>s+w.secs,0)),(r.waits||[]).length]));
 if(rows.length<2){alert('No saved rounds yet. Tap "Save & new round" first.');return}
 const q=v=>{v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};const csv=rows.map(r=>r.map(q).join(',')).join('\n');const lastCap=(hist[hist.length-1]||{}).cap||'';const cc=[lastCap,$('cc').value.trim()].filter(Boolean).join(',');
 const d=new Date().toISOString().slice(0,10);
 mail('WPGC Pace Card CSV '+d,csv)};
// icon + manifest
const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#0b3d1e';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.font='bold 70px sans-serif';x.textAlign='center';x.fillText('4:10',90,115);
const icon=new URL('icon.png',location.href).href;
$('mf').href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify({name:'WPGC Pace Card',short_name:'Pace Card',display:'standalone',background_color:'#0b3d1e',theme_color:'#0b3d1e',start_url:location.href,icons:[{src:icon,sizes:'180x180',type:'image/png'}]}));
render();setInterval(live,15000);
function wmin(s){return (s/60).toFixed(1)}
function mss(s){s=Math.round(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function qv(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function mail(subj,body){const lastCap=(hist[hist.length-1]||{}).cap||st.cap||'';const cc=[lastCap,$('cc').value.trim()].filter(Boolean).join(',');
 location.href='mailto:drawmaster.wpgc@gmail.com?'+(cc?'cc='+encodeURIComponent(cc)+'&':'')+'subject='+encodeURIComponent(subj)+'&body='+encodeURIComponent(body)}
const hhmm=ms=>{const d=new Date(ms);return P.fmt12(d.getHours()*60+d.getMinutes())};
function stretch(){const i=st.act.findIndex(a=>a==null);return i<0?'after 18':i==0?'holes 1-4':'holes '+(HOLES[i-1]+1)+'-'+HOLES[i]}
['Teebox ','Fairway, waiting for green','Par 3 tee'].forEach(c=>{const b=document.createElement('button');b.className='chip';b.textContent=c.trim();b.onclick=()=>{$('wcom').value=c;$('wcom').focus();if(st.wait){st.wait.comment=c;save()}};$('chips').appendChild(b)});
$('wcom').oninput=e=>{if(st.wait){st.wait.comment=e.target.value;save()}};
$('wbtn').onclick=()=>{st.waits=st.waits||[];
 if(!st.wait){st.wait={start:Date.now(),comment:'',stretch:stretch()};$('wcom').value=''}
 else{const w=st.wait;w.end=Date.now();w.secs=Math.round((w.end-w.start)/1000);w.comment=$('wcom').value.trim();st.waits.push(w);st.wait=null}
 save();wrender()};
window.wedit=i=>{const c=prompt('Comment for wait '+(i+1),st.waits[i].comment||'');if(c!=null){st.waits[i].comment=c.trim();save();wrender()}};
window.wdel=i=>{if(confirm('Delete this wait?')){st.waits.splice(i,1);save();wrender()}};
function wrender(){const on=!!st.wait;$('wbtn').className=on?'on':'';$('wbox').style.display=on?'block':'none';
 $('wbtn').textContent=on?'■ Stop Wait  '+mss((Date.now()-st.wait.start)/1000):'⏸ Start Wait';
 const ws=st.waits||[];const tot=ws.reduce((s,w)=>s+w.secs,0);
 $('wlist').innerHTML=ws.length?'<details class="card"><summary style="font-weight:800;cursor:pointer">Waits this round: '+ws.length+' · total '+mss(tot)+'</summary>'+ws.map((w,i)=>'<div class="row" style="margin-top:6px"><span>'+hhmm(w.start)+' · <b>'+mss(w.secs)+'</b> · '+(w.comment||'<i>no comment</i>')+'</span><span><button class="chip" onclick="wedit('+i+')">Edit</button><button class="chip" onclick="wdel('+i+')">✕</button></span></div>').join('')+'</details>':''}
$('wcsv').onclick=()=>{const rows=[['course','date','group','captain_email','sched_tee','actual_tee','wait_no','start','end','wait_mmss','wait_min','stretch','comment']];
 hist.forEach(r=>(r.waits||[]).forEach((w,i)=>rows.push([r.course||'',r.date,r.grp||'',r.cap||'',r.tee,r.atee||'',i+1,hhmm(w.start),hhmm(w.end),mss(w.secs),wmin(w.secs),w.stretch||'',w.comment||''])));
 if(rows.length<2){alert('No waits in saved rounds yet. Tap "Save & new round" first.');return}
 mail('WPGC Wait Log CSV '+new Date().toISOString().slice(0,10),rows.map(r=>r.map(qv).join(',')).join('\n'))};
setInterval(()=>{if(st.wait)wrender()},1000);
wrender();
}
</script></body></html>
